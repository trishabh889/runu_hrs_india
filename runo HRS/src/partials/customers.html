<div class="view-header">
  <div class="view-title-group">
    <h1>CUSTOMERS DIRECTORY</h1>
    <p>Manage OEM client accounts, tool room partners, contact personnel, and project history</p>
  </div>
  <div class="view-actions">
    <button class="btn-action-primary" id="btn-add-customer-modal">+ ADD CUSTOMER</button>
    <button class="btn-action-secondary" id="btn-export-customers-excel">EXPORT EXCEL</button>
    <button class="btn-action-secondary" id="btn-export-customers-pdf">EXPORT PDF</button>
  </div>
</div>

<div class="table-card">
  <div class="table-toolbar" style="flex-wrap: wrap; gap: 10px; align-items: center;">
    <div class="search-box" style="flex: 1 1 240px;">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="search-customers" placeholder="Search by Company, Contact Person, City, GSTIN...">
    </div>

    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 11px; font-weight: 700; color: var(--text-muted);">FINANCIAL YEAR:</span>
      <select id="filter-cust-fy" class="filter-select-compact">
        <option value="ALL">ALL PROJECTS</option>
        <option value="2026">FY 2026-27</option>
        <option value="2027">FY 2027-28</option>
        <option value="2028">FY 2028-29</option>
      </select>
    </div>

    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="font-size: 11px; font-weight: 700; color: var(--text-muted);">CATEGORY:</span>
      <select id="filter-cust-category" class="filter-select-compact">
        <option value="ALL">ALL CATEGORIES</option>
        <option value="HRS">HRS</option>
        <option value="HRTC">HRTC</option>
        <option value="SPARE-HRS">SPARE-HRS</option>
        <option value="SPARE-HRTC">SPARE-HRTC</option>
      </select>
    </div>
  </div>

  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>CUSTOMER NAME</th>
          <th>CONTACT PERSON</th>
          <th>CONTACT NUMBER</th>
          <th>OFFICIAL EMAIL</th>
          <th>LOCATION &amp; ADDRESS</th>
          <th>PROJECTS BREAKDOWN</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="customers-table-body"></tbody>
    </table>
  </div>
</div>
