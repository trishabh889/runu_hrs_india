<div class="view-header">
  <div class="view-title-group">
    <h1>USER MANAGEMENT</h1>
    <p>Manage system operators, design engineers, and administrator access</p>
  </div>
  <div class="view-actions">
    <button class="btn-action-primary" id="btn-add-user-modal">+ ADD USER</button>
  </div>
</div>

<div class="table-card">
  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>USERNAME</th>
          <th>FULL NAME</th>
          <th>ROLE / DESIGNATION</th>
          <th>DEPARTMENT</th>
          <th>STATUS</th>
          <th>EMAIL</th>
          <th>CREATED</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="users-table-body"></tbody>
    </table>
  </div>

  <div class="table-pagination-footer" id="users-pagination-footer">
    <div class="pagination-info" id="users-pagination-info">Showing 1 to 10 of 0 entries</div>
    <div class="pagination-controls" id="users-pagination-controls">
      <button type="button" class="btn-page-nav" id="btn-users-prev">Previous</button>
      <div id="users-page-numbers" class="page-numbers"></div>
      <button type="button" class="btn-page-nav" id="btn-users-next">Next</button>
      <div class="page-size-wrap">
        <select id="users-page-size" class="page-size-select no-tomselect">
          <option value="10" selected>10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span>/ page</span>
      </div>
    </div>
  </div>
</div>

<!-- Shared circular legends -->
<div class="status-legend-footer">
  <div class="status-legend-stack">
    <div class="status-legend" role="group" aria-label="Status legend">
      <span class="status-legend__title">Status Legend:</span>
      <div class="status-legend__items">
        <span class="status-legend__item"><span class="status-legend__dot badge badge-completed" aria-hidden="true"></span><span>Approved</span></span>
        <span class="status-legend__item"><span class="status-legend__dot badge badge-pending" aria-hidden="true"></span><span>Pending Approval</span></span>
      </div>
    </div>
    <div class="status-legend" role="group" aria-label="Role legend">
      <span class="status-legend__title">Role Legend:</span>
      <div class="status-legend__items">
        <span class="status-legend__item"><span class="status-legend__dot badge badge-admin" aria-hidden="true"></span><span>Admin</span></span>
        <span class="status-legend__item"><span class="status-legend__dot badge badge-active" aria-hidden="true"></span><span>Department User</span></span>
      </div>
    </div>
  </div>
</div>
