<!-- Customer Modal -->
<div id="modal-customer" class="modal-overlay">
  <div class="modal-box modal-lg">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="display: inline-block; width: 4px; height: 16px; background: var(--brand-orange); border-radius: 2px;"></span>
        <h3 id="modal-customer-title">CLIENT ACCOUNT REGISTRATION</h3>
      </div>
      <button class="btn-close-modal" onclick="closeModal('modal-customer')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-customer" onsubmit="return false;">
        <input type="hidden" id="cust-id">
        <div class="form-section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
          COMPANY & ACCOUNT PROFILE
        </div>
        <div class="form-grid">
          <div class="form-group span-2">
            <label class="form-label">COMPANY LEGAL NAME *</label>
            <input type="text" id="cust-company" class="form-input" placeholder="e.g., Minda Corporation Ltd." required>
          </div>
          <div class="form-group">
            <label class="form-label">ACCOUNT / REF CODE</label>
            <input type="text" id="cust-code" class="form-input" placeholder="e.g., CUST-MIND-01">
          </div>
          <div class="form-group">
            <label class="form-label">INDUSTRY / SECTOR</label>
            <select id="cust-industry" class="form-select">
              <option value="Automotive Lighting & Plastics">Automotive Lighting & Plastics</option>
              <option value="Automotive Interiors & Exterior">Automotive Interiors & Exterior</option>
              <option value="Consumer White Goods & Appliances">Consumer White Goods & Appliances</option>
              <option value="Electrical & Electronics">Electrical & Electronics</option>
              <option value="Medical & Pharmaceutical Tooling">Medical & Pharmaceutical Tooling</option>
              <option value="Rigid Packaging & Closures">Rigid Packaging & Closures</option>
              <option value="Precision Toolroom / Mold Maker">Precision Toolroom / Mold Maker</option>
              <option value="General Engineering">General Engineering</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">CLIENT TIER</label>
            <select id="cust-tier" class="form-select">
              <option value="Tier-1 OEM Supplier">Tier-1 OEM Supplier</option>
              <option value="Direct OEM">Direct OEM</option>
              <option value="Mould Maker / Tool Room">Mould Maker / Tool Room</option>
              <option value="Strategic Tooling Partner">Strategic Tooling Partner</option>
              <option value="Global Export Client">Global Export Client</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">PAYMENT TERMS</label>
            <select id="cust-payment-terms" class="form-select">
              <option value="30 Days Net">30 Days Net</option>
              <option value="45 Days Net">45 Days Net</option>
              <option value="60 Days Net">60 Days Net</option>
              <option value="50% Adv / 50% Against Dispatch">50% Adv / 50% Against Dispatch</option>
              <option value="100% Advance Against PO">100% Advance Against PO</option>
              <option value="LC at Sight">LC at Sight</option>
            </select>
          </div>
        </div>
        <div class="form-section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          KEY CONTACT PERSONNEL
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">PRIMARY CONTACT PERSON *</label>
            <input type="text" id="cust-contact" class="form-input" placeholder="e.g., Ramesh Verma">
          </div>
          <div class="form-group">
            <label class="form-label">DESIGNATION / DEPT</label>
            <input type="text" id="cust-designation" class="form-input" placeholder="e.g., Head - Tooling & NPD">
          </div>
          <div class="form-group">
            <label class="form-label">PHONE / MOBILE NUMBER</label>
            <input type="text" id="cust-phone" class="form-input" placeholder="e.g., +91 98200 11223">
          </div>
          <div class="form-group">
            <label class="form-label">OFFICIAL EMAIL ID</label>
            <input type="email" id="cust-email" class="form-input" placeholder="e.g., r.verma@minda.com">
          </div>
        </div>
        <div class="form-section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          STATUTORY TAX & DISPATCH LOCATION
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">GSTIN / TAX IDENTIFICATION</label>
            <input type="text" id="cust-gstin" class="form-input" placeholder="e.g., 06AAACM1234D1Z5" style="text-transform: uppercase;">
          </div>
          <div class="form-group">
            <label class="form-label">PAN / CORPORATE TAX ID</label>
            <input type="text" id="cust-pan" class="form-input" placeholder="e.g., AAACM1234D" style="text-transform: uppercase;">
          </div>
          <div class="form-group">
            <label class="form-label">PLANT CITY & STATE</label>
            <input type="text" id="cust-city" class="form-input" placeholder="e.g., IMT Manesar, Gurugram, HR">
          </div>
          <div class="form-group">
            <label class="form-label">POSTAL / PIN CODE</label>
            <input type="text" id="cust-pincode" class="form-input" placeholder="e.g., 122050">
          </div>
          <div class="form-group span-2">
            <label class="form-label">FACTORY / DISPATCH DELIVERY ADDRESS</label>
            <textarea id="cust-address" class="form-textarea" placeholder="Complete unit / plot address for dispatch logistics..." style="min-height: 55px;"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-action-secondary" onclick="closeModal('modal-customer')">CANCEL</button>
          <button type="submit" class="btn-action-primary">SAVE CLIENT PROFILE</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- User Modal -->
<div id="modal-user" class="modal-overlay">
  <div class="modal-box" style="max-width: 600px;">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="display: inline-block; width: 4px; height: 16px; background: var(--brand-orange); border-radius: 2px;"></span>
        <h3 id="modal-user-title">SYSTEM USER ACCOUNT</h3>
      </div>
      <button class="btn-close-modal" onclick="closeModal('modal-user')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-user" onsubmit="return false;">
        <input type="hidden" id="usr-id">
        <div class="form-section-title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
          CREDENTIALS & ROLE ACCESS
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">USERNAME *</label>
            <input type="text" id="usr-username" class="form-input" placeholder="e.g., anand.s" required>
          </div>
          <div class="form-group">
            <label class="form-label">ROLE *</label>
            <select id="usr-role" class="form-select" required>
              <option value="ADMIN">ADMIN (Full Control)</option>
              <option value="ENGINEER">ENGINEER (Design & Release)</option>
              <option value="OPERATOR">OPERATOR (Shopfloor Machining)</option>
            </select>
          </div>
          <div class="form-group span-2">
            <label class="form-label">PASSWORD *</label>
            <input type="password" id="usr-password" class="form-input" placeholder="Enter secure login password" required>
          </div>
        </div>
        <div class="form-section-title" style="margin-top: 14px;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          PERSONNEL INFORMATION & DEPARTMENT
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">FULL NAME</label>
            <input type="text" id="usr-fullname" class="form-input" placeholder="e.g., Anand Sharma">
          </div>
          <div class="form-group">
            <label class="form-label">OFFICIAL EMAIL</label>
            <input type="email" id="usr-email" class="form-input" placeholder="e.g., anand@runohrs.com">
          </div>
          <div class="form-group span-2">
            <label class="form-label">DEPARTMENT / TEAM</label>
            <input type="text" id="usr-department" class="form-input" placeholder="e.g., Design & Tooling / Executive Management">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-action-secondary" onclick="closeModal('modal-user')">CANCEL</button>
          <button type="submit" class="btn-action-primary">SAVE USER</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Project Details Modal -->
<div id="modal-project-details" class="modal-overlay">
  <div class="modal-box" style="max-width: 750px;">
    <div class="modal-header">
      <h3 id="modal-proj-title">PROJECT SPECIFICATIONS</h3>
      <button class="btn-close-modal" onclick="closeModal('modal-project-details')">&times;</button>
    </div>
    <div class="modal-body" id="modal-proj-content"></div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>
